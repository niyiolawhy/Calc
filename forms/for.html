<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name ="viewport" content="width=device-width, initial-scale=1.0" />"
        <title>CONTACT US </title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100">

    
    <div class="max-w-6xl  ml-24 pl-16 mx-auto min-h-screen p-10">
        <h1 class="justify-center   aligns-center text-center flex font-bold text-3xl transform -translate-y-[30px]">Contact Us</h1>

    
        <div class="flex justify-center gap-16  items-start">
            <div class="flex flex-col gap-6 mt-10">
        <div class=" flex items-center gap-4 ">
        <img src="../photos/icon.png" class="w-12 h-12">

        <div>
            <h2 class="text-3xl font-bold">Call</h2>
            <p>084524145547</p>
        </div>
        </div>

        <div class="flex items-center gap-4 mb-15">
        <img src="../photos/icon (1).png" class="w-12 h-12">

        <div>
            <h2 class="text-3xl font-bold">Email</h2>
            <p>loremipsum@gmail.com</p>
        </div>
        </div>

        <div class="flex items-center gap-4 mb-10">
        <img src="../photos/icon (2).png">

        <div>
            <h2 class="text-3xl font-bold">Location</h2>
            <p>Bandung, Indonesia</p>
        </div>
        </div>
        </div>

        <div class="flex flex-col gap-10">
            <form id="contactForm">
        <div>
        <input
    type="text"
    id="name"
    placeholder="Name"
    class="w-[250px] flex  mb-10  h-[40px] bg-white-100 rounded-none px-6 text-xl outline-none"/>
        </div>
        

        <div>
    <input
    type="email"
    id="email"
    placeholder="Email address" 
    class="w-[255px] flex gap-4 mb-10 h-[40px] bg-white-100 rounded-none px-6 text-xl outline-none"/>
        </div>

        <div>
    <textarea
    placeholder="Message"
    id="message"
    class="w-[250px] flex mb-10 h-[100px] bg-white-100 rounded-none px-6 py-5 text-xl outline-none resize-none"></textarea>
        </div>

        <div>
    <button
    type="submit"
    id="sendButton"
    class="w-[250px] left-10 right-10 items-center  text-center justify-center flex mb-10 h-[40px] bg-orange-400 text-white rounded-none text-xl font-semibold">SEND NOW</button>
        </form>
        </div>

        <!-- Submission List -->
    <div class="bg-white mt-10 flex flex-col  p-6 rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold mb-6">
        Submissions
      </h2>

      <div id="submissionList" class="space-y-4">

        <p class="text-gray-400 text-center">
          No submissions yet.
        </p>
      </div>
    </div>

        </div>
        </div>
    
    
    


    </div>
    

<script src="for.js"></script>
    
    </body>
</html>
